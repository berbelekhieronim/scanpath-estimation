<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Start — scanpath-estimation</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .hero { margin-bottom: 20px; }
  .hero h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .hero .sub { color: var(--muted); }

  /* Readiness first: the states that ruin a session are the ones you want to
     see before it starts, not discover during it. */
  .ready {
    display: grid; gap: 10px; margin-bottom: 20px;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  }
  .rcard {
    background: var(--surface); border: 1px solid var(--border);
    border-left-width: 3px; border-radius: var(--radius); padding: 11px 14px;
  }
  .rcard.ok { border-left-color: var(--ok); }
  .rcard.warn { border-left-color: var(--warn); }
  .rcard.bad { border-left-color: var(--danger); }
  .rcard .l { color: var(--muted); font-size: 0.6875rem;
              text-transform: uppercase; letter-spacing: .05em; }
  .rcard .v { font-size: 1.125rem; font-weight: 700; line-height: 1.25;
              font-variant-numeric: tabular-nums; }
  .rcard .n { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }

  .warn-item {
    border-radius: var(--radius); padding: 11px 15px; font-size: 0.9375rem;
    border: 1px solid var(--border); background: var(--surface); margin-bottom: 9px;
  }
  .warn-item.error { border-color: var(--danger); }
  .warn-item.warn { border-color: var(--warn); }

  h2.sec { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .07em;
           color: var(--muted); margin: 26px 0 10px; }

  .links { display: grid; gap: 9px;
           grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .link {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px;
    text-decoration: none; color: inherit; transition: border-color .12s;
  }
  .link:hover { border-color: var(--accent); }
  /* Both were inline spans, so the name and its description rendered as one
     run-together word: "ControlsLayers, capture mode, image, model". The
     margin-top below had no effect on an inline box either. */
  .link .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .link .nm { font-weight: 600; }
  .link .ds { color: var(--muted); font-size: 0.8125rem; }
  .link .pth { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: 0.75rem; color: var(--accent); white-space: nowrap; }
  .link.locked { opacity: .55; }
  .link.locked .pth { color: var(--warn); }

  .join { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size: 0.875rem; word-break: break-all; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.875rem; }
</style>
</head>
<body>
<div class="wrap">

  <nav class="nav" id="nav"></nav>

  <div class="hero">
    <h1>scanpath-estimation</h1>
    <div class="sub">One server. These are its pages.</div>
  </div>

  <div class="ready" id="ready"></div>
  <div id="warnings"></div>

  <div class="card" id="token-box">
    <div style="margin-bottom:9px" id="token-msg"></div>
    <div class="row">
      <input type="password" id="token" placeholder="Control token" autocomplete="off">
      <button class="primary" id="save">Unlock</button>
      <button id="forget" style="display:none">Forget</button>
    </div>
  </div>

  <h2 class="sec">Run the session</h2>
  <div class="links" id="main-links"></div>

  <h2 class="sec">Participants see</h2>
  <div class="links" id="participant-links"></div>

  <h2 class="sec">Data</h2>
  <div class="links" id="data-links"></div>

  <h2 class="sec">Diagnostics</h2>
  <details>
    <summary>Tools for checking the setup</summary>
    <div class="links" id="diag-links" style="margin-top:10px"></div>
  </details>

  <h2 class="sec">Join address</h2>
  <div class="card"><div class="join" id="join">…</div></div>

</div>

<script type="module">
import { renderNav } from '/static/nav.js';
renderNav('/start');
</script>
<script>
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = 'scanpath_control_token';
let token = localStorage.getItem(TOKEN_KEY) ||
            new URLSearchParams(location.search).get('k') || '';

/* Grouped by what you are doing, not by what exists. The presenter needs two
   pages during a session; everything else is setup or diagnosis, and burying
   those is the point of the grouping. */
const GROUPS = {
  'main-links': [
    { path: '/control', nm: 'Controls', ds: 'Layers, capture mode, image, model', locked: true },
    { path: '/display', nm: 'Display', ds: 'The projected screen' },
  ],
  'participant-links': [
    { path: '/qr', nm: 'Join screen', ds: 'QR code to project while people arrive' },
    { path: '/', nm: 'Participant view', ds: 'Routes each person to tapping or the camera' },
    { path: '/?newid=1', nm: 'Participant view, fresh id', ds: 'Forget this device and be assigned again — for testing' },
  ],
  'data-links': [
    { path: '/charts', nm: 'Comparison charts', ds: 'Tapped vs measured vs model, with intervals and a table' },
    { path: '/api/export', nm: 'Download JSON', ds: 'Everything: taps, gaze, calibration, device info', locked: true, raw: true },
    { path: '/admin', nm: 'Images', ds: 'Rescan the folder, choose the active image', locked: true },
  ],
  'diag-links': [
    { path: '/gazetest', nm: 'Gaze tracking test', ds: 'Does the camera work on this device and network?' },
    { path: '/calibrate?mock=1', nm: 'Rehearse calibration', ds: 'The full flow with no camera' },
    { path: '/api/raw', nm: 'Raw state', ds: 'What the display is drawn from', raw: true },
  ],
};

function renderLinks() {
  for (const [id, items] of Object.entries(GROUPS)) {
    $(id).innerHTML = items.map((it) => {
      const needs = it.locked && !token;
      const href = it.locked && token
        ? `${it.path}${it.path.includes('?') ? '&' : '?'}k=${encodeURIComponent(token)}`
        : it.path;
      return `<a class="link ${needs ? 'locked' : ''}" href="${href}"
                 ${it.raw ? '' : 'target="_blank" rel="noopener"'}>
          <span class="txt"><span class="nm">${it.nm}</span><span class="ds">${it.ds}</span></span>
          <span class="pth">${needs ? 'needs token' : it.path}</span>
        </a>`;
    }).join('');
  }
}

function card(label, value, note, cls) {
  return `<div class="rcard ${cls}"><div class="l">${label}</div>
          <div class="v">${value}</div><div class="n">${note}</div></div>`;
}

async function refresh() {
  let s;
  try { s = await fetch('/api/status').then((r) => r.json()); }
  catch { $('ready').innerHTML = card('Server', 'unreachable', '', 'bad'); return; }

  const mode = s.capture_mode;
  const c = s.conditions;
  const g = s.gaze;

  const cards = [
    card('Images', s.images.count,
         s.images.active ? `showing “${s.images.active.label}”` : 'none active',
         s.images.count && s.images.active ? 'ok' : 'bad'),
    card('Join address', s.join_url_reachable ? 'reachable' : 'local only',
         s.join_url_reachable ? 'participants can connect' : 'set the port to Public',
         s.join_url_reachable ? 'ok' : 'bad'),
    card('Capture mode', mode,
         mode === 'mixed' && c ? `${c.tap.completed} tapped · ${c.gaze.completed} tracked`
                               : (mode === 'tap' ? 'everyone taps' : 'everyone tracked'), 'ok'),
    card('Tap responses', s.responses.participants,
         `${s.responses.markers} marks`, s.responses.participants ? 'ok' : ''),
    card('Gaze data', g.contributors,
         `${g.samples} samples${g.excluded ? ` · ${g.excluded} excluded` : ''}`,
         g.contributors ? 'ok' : (mode === 'tap' ? '' : 'warn')),
    card('Model runs', s.model_runs.count,
         s.model_runs.synthetic ? `${s.model_runs.synthetic} SYNTHETIC` : 'ready',
         s.model_runs.synthetic ? 'warn' : (s.model_runs.count ? 'ok' : 'warn')),
  ];
  $('ready').innerHTML = cards.join('');

  // A stale process serves fresh pages from disk while running old Python,
  // so the UI offers features the backend does not have. Loud, because it
  // looks like a dozen unrelated bugs.
  const stale = s.server && s.server.stale
    ? [`<div class="warn-item error"><strong>The server is running older code
        than what is on disk.</strong> Pages update from disk instantly but
        Python does not — restart it, or the interface will offer things the
        backend rejects.<br>
        <code>tools/devserver.sh restart</code>, or Ctrl-C and rerun uvicorn.
        Add <code>--reload</code> during development to avoid this.</div>`]
    : [];

  $('warnings').innerHTML = stale.concat(s.warnings.map((w) =>
    `<div class="warn-item ${w.level}">${w.text}</div>`)).join('');
  $('join').innerHTML = s.join_url_reachable ? s.join_url
    : `${s.join_url} <span style="color:var(--danger)">— only this machine can open that</span>`;
}

function renderToken() {
  const have = !!token;
  $('token-msg').textContent = have
    ? 'Token stored in this browser — the locked links below will open directly.'
    : 'Paste the control token to unlock the presenter pages. It is printed in the server console at startup.';
  $('forget').style.display = have ? '' : 'none';
  $('token').value = '';
}

$('save').addEventListener('click', () => {
  const v = $('token').value.trim();
  if (!v) return;
  token = v; localStorage.setItem(TOKEN_KEY, token);
  renderToken(); renderLinks();
});
$('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('save').click(); });
$('forget').addEventListener('click', () => {
  token = ''; localStorage.removeItem(TOKEN_KEY); renderToken(); renderLinks();
});

if (token) localStorage.setItem(TOKEN_KEY, token);
renderToken(); renderLinks(); refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
