<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Where would you look?</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/capture.css">
</head>
<body>

<div class="capture" id="app">

  <div class="prompt" id="prompt">
    <h1>Where would your eyes go?</h1>
    <p class="hint" id="hint">Loading…</p>
    <div class="counter" id="counter"></div>
  </div>

  <div class="stage" id="stage">
    <div class="frame" id="frame" hidden>
      <img id="photo" alt="Scene to look at" draggable="false">
      <svg class="overlay" id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <polyline id="path" fill="none" stroke="#fff" stroke-width="1.6"
                  stroke-opacity=".62" stroke-linejoin="round" stroke-linecap="round"
                  vector-effect="non-scaling-stroke"></polyline>
      </svg>
    </div>
  </div>

  <div class="actions" id="actions" hidden>
    <button id="undo" disabled>Undo</button>
    <button id="submit" class="primary" disabled>Submit</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { deviceInfo } from '/static/device.js';

const $ = (s) => document.getElementById(s);
const UUID_KEY = 'scanpath_participant_uuid';

function participantUuid() {
  // ?newid=1 forgets this device's identity, so the next assignment is a
  // fresh draw. Assignment is deliberately sticky per participant — one
  // person must not do both conditions — which means one test phone always
  // lands in the same group until this is used.
  if (new URLSearchParams(location.search).get('newid') === '1') {
    try {
      localStorage.removeItem(UUID_KEY);
      localStorage.removeItem('scanpath_gaze_session_id');
      localStorage.removeItem('scanpath_camera_consent');
    } catch {}
    history.replaceState(null, '', location.pathname);
  }
  let id = localStorage.getItem(UUID_KEY);
  if (!id) {
    id = (crypto.randomUUID && crypto.randomUUID()) ||
         ('p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 11));
    localStorage.setItem(UUID_KEY, id);
  }
  return id;
}

let state = null;     // server state for the round being shown
let taps = [];        // [{x, y}] normalised 0..1
let submitting = false;

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function renderCounter() {
  if (!state) return;
  const n = state.tap_count;
  $('counter').innerHTML = Array.from({ length: n }, (_, i) =>
    `<span class="pip ${i < taps.length ? 'filled' : ''}"></span>`).join('');
}

function renderMarkers() {
  const frame = $('frame');
  frame.querySelectorAll('.marker').forEach((m) => m.remove());
  taps.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'marker';
    d.style.left = (t.x * 100) + '%';
    d.style.top = (t.y * 100) + '%';
    d.textContent = String(i + 1);
    frame.appendChild(d);
  });
  $('path').setAttribute('points',
    taps.map((t) => `${t.x * 100},${t.y * 100}`).join(' '));

  const done = taps.length >= state.tap_count;
  frame.classList.toggle('done', done);
  $('undo').disabled = taps.length === 0;
  $('submit').disabled = !done || submitting;
  $('hint').textContent = done
    ? 'That’s all five. Change one with Undo, or submit.'
    : `Tap ${state.tap_count} places, in the order you think you'd look.`;
  renderCounter();
}

function addTap(ev) {
  if (!state || taps.length >= state.tap_count || submitting) return;
  const r = $('frame').getBoundingClientRect();
  if (!r.width || !r.height) return;
  const x = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
  taps.push({ x, y });
  renderMarkers();
}

function showThanks(count) {
  $('prompt').hidden = true;
  $('actions').hidden = true;

  // Offer the measurement stage, unless this device already declined the
  // camera. Without this the journey dead-ends here and the eye-tracking
  // half of the demo is unreachable from the participant's own phone.
  // In a between-subjects design the tap group must NOT also be measured,
  // so the offer only appears when the presenter is running tap-only mode
  // and is deliberately collecting both from the same people.
  let consent = null;
  try { consent = localStorage.getItem('scanpath_camera_consent'); } catch {}
  const betweenSubjects = window.__captureMode && window.__captureMode !== 'tap';
  const offer = (consent === 'declined' || betweenSubjects) ? '' : `
      <p style="margin-top:22px">Now the other half: we can <strong>measure</strong>
         where your eyes actually go, and compare it with what you just
         predicted.</p>
      <button class="primary" id="to-camera"
              style="margin-top:12px;padding:14px 24px;font-size:1rem">
        Measure where I really look
      </button>`;

  $('stage').innerHTML = `<div class="state">
      <div>
        <div class="big">✓</div>
        <h2>Thank you</h2>
        <p>Your ${count} marks are in.</p>
        ${offer || '<p>Look up at the screen.</p>'}
      </div>
    </div>`;

  const btn = $('to-camera');
  if (btn) {
    btn.addEventListener('click', () => {
      location.href = consent === 'granted' ? '/calibrate' : '/consent';
    });
  }
}

/* Arriving back here from the camera stages. Landing on the tap screen with
   no explanation is disorienting — it looks like the app forgot what just
   happened. */
function showReturnState() {
  const p = new URLSearchParams(location.search);
  const messages = {
    nocamera: ['No camera measurement', 'That part was skipped. Your taps still count — look up at the screen.'],
    declined: ['Camera not used', 'Your taps still count — look up at the screen.'],
    viewed: ['All done', 'We have both your prediction and your actual looking. Look up at the screen.'],
  };
  for (const key of Object.keys(messages)) {
    if (!p.has(key)) continue;
    const [title, body] = messages[key];
    $('prompt').hidden = true;
    $('actions').hidden = true;
    $('stage').innerHTML =
      `<div class="state"><div><div class="big">✓</div>
        <h2>${title}</h2><p>${body}</p></div></div>`;
    return true;
  }
  return false;
}

function showWaiting(msg) {
  $('prompt').hidden = true;
  $('actions').hidden = true;
  $('stage').innerHTML = `<div class="state"><div>
      <h2>Nothing to look at yet</h2>
      <p>${msg}</p>
    </div></div>`;
}

async function submit() {
  if (submitting || !state) return;
  submitting = true;
  $('submit').disabled = true;
  $('submit').textContent = 'Sending…';
  try {
    const res = await fetch('/api/markers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        round_id: state.round_id,
        participant_uuid: participantUuid(),
        device: deviceInfo(),
        points: taps.map((t) => [t.x, t.y]),
      }),
    });
    if (res.status === 409) {
      const d = await res.json().catch(() => ({}));
      toast(d.detail || 'The image changed. Reloading.');
      setTimeout(() => location.reload(), 1600);
      return;
    }
    if (!res.ok) throw new Error('Server said ' + res.status);
    const out = await res.json();
    showThanks(out.saved);
  } catch (e) {
    // Never strand a participant on a dead button — let them retry.
    toast('Could not send. Check your connection and try again.');
    submitting = false;
    $('submit').textContent = 'Submit';
    $('submit').disabled = false;
  }
}

/* Which condition is this participant in?
 *
 * Between-subjects: a participant either predicts by tapping or is measured
 * by camera, never both. Doing both would mean the tapping primes the
 * looking, and the measurement would no longer be of naive viewing.
 */
async function routeByCondition() {
  let a;
  try {
    const forced = new URLSearchParams(location.search).get('as');
    a = await fetch('/api/assign', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        participant_uuid: participantUuid(),
        ...(forced === 'tap' || forced === 'gaze' ? { force: forced } : {}),
      }),
    }).then((r) => (r.ok ? r.json() : null));
  } catch { return false; }
  if (!a || a.completed) return false;

  if (a.condition === 'gaze') {
    let consent = null;
    try { consent = localStorage.getItem('scanpath_camera_consent'); } catch {}
    if (consent === 'declined') return false;   // fall back to tapping
    location.href = consent === 'granted' ? '/calibrate' : '/consent';
    return true;
  }
  return false;
}

async function init() {
  if (showReturnState()) return;
  if (await routeByCondition()) return;
  let s;
  try {
    s = await fetch('/api/state').then((r) => r.json());
  } catch {
    showWaiting('Could not reach the server. Check your connection and reload.');
    return;
  }
  if (!s.image || !s.round_id) {
    showWaiting('The presenter has not chosen an image yet. This page will pick it up automatically.');
    setTimeout(init, 4000);
    return;
  }
  state = s;
  window.__captureMode = s.capture_mode;

  const frame = $('frame');
  frame.style.aspectRatio = `${s.image.width} / ${s.image.height}`;
  $('photo').src = '/img/' + encodeURIComponent(s.image.filename);
  frame.hidden = false;
  $('actions').hidden = false;

  frame.addEventListener('pointerdown', (e) => { e.preventDefault(); addTap(e); });
  $('undo').addEventListener('click', () => { taps.pop(); renderMarkers(); });
  $('submit').addEventListener('click', submit);

  renderMarkers();
}

// Stop iOS rubber-banding the page while someone taps near an edge.
document.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) e.preventDefault();
}, { passive: false });

init();
</script>
</body>
</html>
