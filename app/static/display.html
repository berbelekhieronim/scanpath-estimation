<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Display — scanpath-estimation</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/charts.css">
<link rel="stylesheet" href="/static/display.css">
</head>
<body>

<div class="display">

  <div class="topbar">
    <div class="title" id="title">…</div>
    <div class="tallies" id="tallies"></div>
  </div>

  <div class="stage" id="stage">
    <div class="frame" id="frame" hidden>
      <img id="photo" alt="">
      <canvas id="heat"></canvas>
      <svg id="paths" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
      <svg id="model" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
      <canvas id="gaze"></canvas>
      <svg id="gazepaths" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="explain" id="explain"></div>
  <div class="prompt-panel" id="prompt-panel" hidden></div>
  <div class="analysis" id="analysis" hidden></div>
  <div class="legend" id="legend"></div>

</div>

<script type="module">
import { drawHeatmap } from '/static/heatmap.js';
import {
  densityPanels, sequentialScale, differenceMap, legendRow, MORE_IS, OVERLAY,
} from '/static/charts.js';

const $ = (id) => document.getElementById(id);
let lastSignature = '';
let currentRoundId = null;
let imageAspect = null;

function setEmpty(msg) {
  $('frame').hidden = true;
  $('stage').innerHTML = `<div class="empty-state"><div>
      <h2>Nothing on display</h2><p>${msg}</p></div></div>`;
}

function renderPaths(paths, show) {
  const svg = $('paths');
  if (!show) { svg.innerHTML = ''; return; }
  const V = 1000;
  // One faint line per participant. Individually they are noise; together
  // the shared structure is the point, so they are drawn low-contrast and
  // let the heatmap carry the density.
  // Tapped blue, the same identity the tapped heatmap and the charts use.
  // These were white, while the legend showed a red dot beside them.
  svg.innerHTML = paths.map((pts) => {
    const d = pts.map(([x, y]) => `${x * V},${y * V}`).join(' ');
    const dots = pts.map(([x, y], i) =>
      `<circle cx="${x * V}" cy="${y * V}" r="${i === 0 ? 7 : 4.5}"
        fill="${i === 0 ? OVERLAY.tappedInk : OVERLAY.tapped}"
        stroke="${i === 0 ? OVERLAY.tapped : 'none'}" stroke-width="2"
        vector-effect="non-scaling-stroke"/>`).join('');
    return `<polyline points="${d}" fill="none" stroke="${OVERLAY.tapped}"
              stroke-opacity=".55" stroke-width="2" stroke-linejoin="round"
              stroke-linecap="round"
              vector-effect="non-scaling-stroke"/>${dots}`;
  }).join('');
}

function renderGaze(data, show) {
  const c = $('gaze');
  if (!c.width || !c.height) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  if (!show || !data || !data.points.length) return;
  // Measured gaze is coarse — roughly a fifth of the screen in error — so it
  // is drawn as a density cloud rather than points pretending to precision.
  // In its own hue: drawn with the tapped ramp, the two clouds were the same
  // picture twice and no audience could separate them.
  // Rings, not a cloud: it shares the picture with the tapped map, and two
  // filled clouds cannot both be seen.
  drawHeatmap(c, data.points, 0.12, 'orange', 'contour');
}

/* Both groups, always. The presenter needs to see the split filling up, and
   an audience understands "18 tapped, 11 eye-tracked" immediately. */
function renderTallies(state, taps, gaze) {
  const items = [];
  const mode = state.capture_mode;
  if (mode !== 'gaze') {
    items.push(`<span class="tally-item tap"><span class="n">${taps.count}</span>
      <span class="lbl">tapped</span></span>`);
  }
  if (mode !== 'tap') {
    items.push(`<span class="tally-item gaze"><span class="n">${gaze.contributors}</span>
      <span class="lbl">eye-tracked${gaze.excluded
        ? ` <span style="opacity:.7">(${gaze.excluded} not usable)</span>` : ''}</span></span>`);
  }
  $('tallies').innerHTML = items.join('');
}

/* A caption, in words, for whatever is currently switched on.
   Without it a projected heatmap is just a coloured blob.

   Every line here names the colour actually on screen. It used to name
   colours that were not: the measured cloud was called purple while being
   drawn with the tapped ramp, and the tap traces were white behind a red
   key. Two sources that look alike are worse than one, so the wording and
   the marks are kept in step deliberately. */
function renderExplain(state, taps, gaze, run) {
  const L = state.layers;
  const on = [];
  // Each entry is one dot plus ONE text node. Split across several nodes the
  // flex gap lands between them, which put a space before every colon and
  // comma in this caption.
  const kn = (cls, html) => `<span class="kn"><span class="dot ${cls}"></span>`
    + `<span class="txt">${html}</span></span>`;

  if (L.heatmap && taps.count) on.push(kn('tap',
    `<strong>Blue cloud</strong>: where ${taps.count} people
     <em>predicted</em> they would look`));
  if (L.paths && taps.count) on.push(kn('tap',
    `<strong>Blue lines</strong>: the order each of those people tapped`));
  if (L.gaze && gaze.contributors) on.push(kn('gaze',
    `<strong>Orange rings</strong>: where ${gaze.contributors}
     <em>different</em> people <em>actually looked</em>, measured by camera —
     tighter rings mean more looking`));
  if (L.gaze_paths && gaze.contributors) on.push(kn('gaze',
    `<strong>Orange traces</strong>: each of their eye paths, starting at the
     pale ring`));
  if (L.model && run) on.push(kn('model',
    `<strong>Green numbered path</strong>: what the model predicts a human
     would do`));

  // Nobody tapped *and* was eye-tracked, so the two clouds are two different
  // groups of people. Left unsaid, an audience reads them as before-and-after
  // for the same person, which is the one thing they are not.
  if (L.heatmap && L.gaze && taps.count && gaze.contributors) on.push(
    `<span class="between">Blue cloud and orange rings are
     <strong>different people</strong> — nobody did both, because tapping
     first would change where you then look. For where the two actually
     differ, switch to Comparison charts.</span>`);

  $('explain').innerHTML = on.length
    ? on.join('')
    : `<span class="none">Nothing overlaid yet — this is the picture as the
       room sees it.</span>`;
}

function renderGazePaths(data, show) {
  const svg = $('gazepaths');
  if (!show || !data || !data.paths.length) { svg.innerHTML = ''; return; }
  const V = 1000;
  // One line per person, in time order. At roughly 3 Hz these are not
  // fixations in the strict sense — they are the sampled path of the eye —
  // so they are drawn as a trace rather than numbered fixation circles.
  svg.innerHTML = data.paths.map((pts) => {
    const d = pts.map(([x, y]) => `${x * V},${y * V}`).join(' ');
    const start = pts[0];
    return `<polyline points="${d}" fill="none" stroke="${OVERLAY.measured}"
              stroke-opacity=".85" stroke-width="2.5" stroke-linejoin="round"
              stroke-linecap="round" vector-effect="non-scaling-stroke"/>` +
      (start ? `<circle cx="${start[0] * V}" cy="${start[1] * V}" r="7"
              fill="${OVERLAY.measuredInk}" stroke="${OVERLAY.measured}" stroke-width="2"
              vector-effect="non-scaling-stroke"/>` : '');
  }).join('');
}

function renderModel(run, show) {
  const svg = $('model');
  if (!show || !run) { svg.innerHTML = ''; return; }
  const V = 1000;

  // All virtual observers, faint, so the model reads as a distribution
  // rather than one cherry-picked path.
  const ghosts = (run.samples_norm || []).slice(1).map((pts) => {
    const d = pts.map(([x, y]) => `${x * V},${y * V}`).join(' ');
    return `<polyline points="${d}" fill="none" stroke="${OVERLAY.model}"
              stroke-opacity=".22" stroke-width="2" stroke-linejoin="round"
              vector-effect="non-scaling-stroke"/>`;
  }).join('');

  // The primary path, drawn solid and numbered.
  const primary = run.scanpath_norm || [];
  const line = primary.map(([x, y]) => `${x * V},${y * V}`).join(' ');
  const dots = primary.map(([x, y], i) => `
      <circle cx="${x * V}" cy="${y * V}" r="15" fill="${OVERLAY.model}"
              stroke="#fff" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <text class="fix-num" x="${x * V}" y="${y * V}" text-anchor="middle"
            dominant-baseline="central">${i + 1}</text>`).join('');

  svg.innerHTML = ghosts + `<polyline points="${line}" fill="none"
      stroke="${OVERLAY.model}" stroke-width="3.5" stroke-linejoin="round"
      stroke-linecap="round" vector-effect="non-scaling-stroke"/>` + dots;
}

function renderExperimentalWarning(run, show) {
  const existing = document.querySelector('.experimental-warning');
  const custom = show && run && run.prompt_kind === 'custom';
  document.body.classList.toggle('has-experimental', !!custom);
  if (!custom) { if (existing) existing.remove(); return; }
  if (existing) return;
  const el = document.createElement('div');
  el.className = 'experimental-warning';
  el.textContent = 'EXPERIMENTAL PROMPT — outside the model\u2019s trained templates, quality unvalidated';
  document.body.appendChild(el);
}

function renderSyntheticWarning(run, show) {
  const existing = document.querySelector('.synthetic-warning');
  const isSynthetic = show && run && run.source === 'synthetic';
  document.body.classList.toggle('has-synthetic', !!isSynthetic);
  if (!isSynthetic) { if (existing) existing.remove(); return; }
  if (existing) return;
  const el = document.createElement('div');
  el.className = 'synthetic-warning';
  el.textContent = 'SYNTHETIC PLACEHOLDER DATA — NOT MODEL OUTPUT';
  document.body.appendChild(el);
}

function esc(s) {
  return String(s).replace(/[<>&]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
}

function renderPrompt(cfg, run, show) {
  const el = $('prompt-panel');
  if (!show || !cfg) { el.hidden = true; return; }
  el.hidden = false;

  // Prefer the prompt the stored run actually used; fall back to what the
  // current configuration would send. They differ if the config changed
  // after the run was made, and showing the run's own text is the honest one.
  const text = (run && run.prompt_text) || cfg.prompt_text;
  const probe = cfg.probe;
  const kind = (run && run.prompt_kind === 'custom') ? 'experimental'
             : (probe ? probe.kind : 'trained');
  const task = probe ? probe.label
             : (cfg.mode === 'freeview' ? 'Free viewing'
                : `Searching for ${cfg.target || '—'}`);

  el.innerHTML = `
    <div class="ptop">
      <span class="ptask">${esc(task)}</span>
      <span class="pkind ${kind}">${kind === 'trained' ? 'Trained template' : 'Experimental'}</span>
      ${probe ? `<span class="pnote">${esc(probe.note)}</span>` : ''}
    </div>
    <pre>${esc(text || 'No prompt available for this configuration.')}</pre>`;
}

const JSON_TABS = [
  ['model', 'Model run'],
  ['markers', 'Human taps'],
  ['analysis', 'Agreement'],
  ['state', 'Display state'],
];
let jsonTab = 'model';

function highlight(obj) {
  return esc(JSON.stringify(obj, null, 2))
    .replace(/&quot;([^&]*?)&quot;(\s*:)/g, '<span class="k">"$1"</span>$2')
    .replace(/:\s&quot;(.*?)&quot;/g, ': <span class="s">"$1"</span>')
    .replace(/:\s(-?\d+\.?\d*)/g, ': <span class="n">$1</span>')
    .replace(/:\s(true|false|null)/g, ': <span class="b">$1</span>');
}

async function renderJson(show) {
  let el = document.getElementById('json-overlay');
  if (!show) { if (el) el.remove(); return; }

  let raw;
  try { raw = await fetch('/api/raw').then((r) => r.json()); }
  catch { return; }

  if (!el) {
    el = document.createElement('div');
    el.className = 'json-overlay';
    el.id = 'json-overlay';
    el.innerHTML = `
      <div class="jtop">
        <div>
          <h2>Raw data</h2>
          <div class="jhint">Exactly what the display is drawn from — nothing hidden.</div>
        </div>
        <div class="json-tabs" id="json-tabs"></div>
      </div>
      <pre id="json-body"></pre>`;
    document.body.appendChild(el);
    document.getElementById('json-tabs').innerHTML = JSON_TABS.map(([k, label]) =>
      `<button data-tab="${k}">${label}</button>`).join('');
    document.getElementById('json-tabs').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      jsonTab = b.dataset.tab;
      renderJson(true);
    });
  }

  document.querySelectorAll('#json-tabs button').forEach((b) =>
    b.classList.toggle('on', b.dataset.tab === jsonTab));
  document.getElementById('json-body').innerHTML = highlight(raw[jsonTab]);
}

/* The charts, projected. A deliberately smaller selection than /charts: no
   table, no dot plot, no tooltips. Nobody reads a nine-row table or hovers a
   mark from the back of a room, and putting them up there would only make the
   two images that do work smaller. */
/* The difference map is the one image the audience has to hold in their head
   after the picture goes away, so it is drawn over a faint plate of the scene
   itself. The three density panels are not: they are read by comparing fills
   across three grids on one scale, and three photographs behind them would
   fight exactly that comparison. They take the scene's proportions only. */
const sceneUrl = (d) => d.image
  ? '/img/' + encodeURIComponent(d.image.filename) : null;
const sceneAspect = (d) => (d.image && d.image.width && d.image.height)
  ? d.image.width / d.image.height : 1;

async function renderCharts(show) {
  let el = document.getElementById('charts-overlay');
  if (!show) { if (el) el.remove(); return; }

  let d;
  try { d = await fetch('/api/compare/maps', {cache: 'no-store'}).then((r) => r.json()); }
  catch { return; }

  if (!el) {
    el = document.createElement('div');
    el.className = 'charts-overlay';
    el.id = 'charts-overlay';
    document.body.appendChild(el);
  }
  el.textContent = '';

  const h2 = document.createElement('h2');
  h2.textContent = 'Where people said they would look, and where they looked';
  el.appendChild(h2);

  if (!d.ok) {
    const p = document.createElement('div');
    p.className = 'headline';
    p.textContent = d.reason === 'no round open'
      ? 'No round is open.'
      : 'Nothing to compare yet — the charts fill in as people finish.';
    el.appendChild(p);
    return;
  }

  const body = document.createElement('div');
  body.className = 'cbody';

  const main = document.createElement('div');
  main.className = 'cmain';
  const mcap = document.createElement('p');
  mcap.className = 'caption';
  mcap.textContent = 'Each grid is one group\u2019s attention, averaged per '
    + 'person, on one shared colour scale \u2014 ' + MORE_IS
    + ' means more looked at.';
  main.appendChild(mcap);
  main.appendChild(densityPanels(d, {hover: false, aspect: sceneAspect(d)}));
  main.appendChild(sequentialScale());
  body.appendChild(main);

  const diff = differenceMap(d, {hover: false, key: false,
    image: sceneUrl(d), aspect: sceneAspect(d)});
  if (diff) {
    const side = document.createElement('div');
    side.className = 'cside';
    const scap = document.createElement('p');
    scap.className = 'caption';
    scap.textContent = 'The gap: measured minus tapped. Red is looked at more '
      + 'than people expected, blue is expected more than looked at.';
    side.appendChild(scap);
    side.appendChild(diff);
    body.appendChild(side);
  }
  el.appendChild(body);

  const foot = document.createElement('div');
  foot.className = 'cfoot';
  foot.appendChild(legendRow(d));
  // The same caveats the analysis page carries. A projected chart is the one
  // that most needs to say when it is not yet evidence.
  const caveats = [];
  if (d.model_source && String(d.model_source).includes('synthetic')) {
    caveats.push('Model panel is a placeholder, not model output');
  }
  if (d.gaze_excluded) {
    caveats.push(d.gaze_excluded + ' calibration(s) excluded');
  }
  if (caveats.length) {
    const w = document.createElement('div');
    w.className = 'cwarn';
    w.textContent = caveats.join(' · ');
    foot.appendChild(w);
  }
  el.appendChild(foot);
}

function fmt(v, digits = 2) {
  return (v === null || v === undefined) ? '—' : Number(v).toFixed(digits);
}

function renderAnalysis(a, show) {
  const el = $('analysis');
  if (!show) { el.hidden = true; return; }
  el.hidden = false;

  if (!a || !a.ok) {
    el.innerHTML = `<div class="headline unavailable">Agreement unavailable —
      ${a && a.reason ? a.reason : 'not enough data yet'}.</div>`;
    return;
  }

  /* Say which two things this compares, before saying how well they agree.
     These numbers are the TAP group against the model; the measured group is
     not in them. Unlabelled, "agreement" beside a screen showing two human
     layers reads as whichever one the viewer had in mind. */
  const cmp = a.compares || {a: 'tapped', b: 'model', excludes: 'measured'};
  const scope = `<div class="scope">
    <span class="kn"><span class="dot tap"></span>Tapped</span>
    <span class="vs">vs</span>
    <span class="kn"><span class="dot model"></span>Model</span>
    <span class="excl">measured gaze is <strong>not</strong> in these numbers —
      turn on Comparison charts for all three</span>
  </div>`;

  const mv = a.model_vs_human, ce = a.human_ceiling, bl = a.baselines;
  const ceilingOk = ce && !ce.unavailable && ce.spearman;

  // The headline compares the model against the human-to-human ceiling, not
  // against perfection. "As well as people agree with each other" is the
  // honest claim; "correct" is not, since neither side is ground truth.
  let headline;
  if (mv.spearman !== null && mv.spearman <= 0) {
    // A ratio against the ceiling would render as a negative percentage,
    // which reads as a bug rather than as the finding it is.
    headline = `The model and the tap group <strong>do not agree</strong> on
      this image — no better than chance.`;
  } else if (ceilingOk && mv.spearman !== null && ce.spearman > 0) {
    const pct = Math.round((mv.spearman / ce.spearman) * 100);
    headline = `The model matches the tap group <strong>${pct}%</strong> as
      well as that group matches itself.`;
  } else if (mv.spearman !== null) {
    headline = `Model vs tapped agreement:
      <strong>${fmt(mv.spearman)}</strong>`;
  } else {
    headline = 'Not enough spread in the responses to correlate yet.';
  }

  const topline = a.top_aoi.agree
    ? `Both put the same area first.`
    : `They disagree on which area comes first.`;

  el.innerHTML = scope + `
    <div class="headline">${headline} ${topline}</div>
    <div class="metrics">
      <div class="metric headline-metric">
        <div class="label">Spatial agreement (Spearman &rho;)</div>
        <div class="value">${fmt(mv.spearman)}</div>
        <div class="against">random ${fmt(bl.random.spearman)} ·
          centre bias ${fmt(bl.centre_bias.spearman)}</div>
      </div>
      <div class="metric ceiling">
        <div class="label">Tap group vs itself (ceiling)</div>
        <div class="value">${ceilingOk ? fmt(ce.spearman) : '—'}</div>
        <div class="against">${ceilingOk
          ? `split-half, ${ce.n_per_half} per side`
          : `needs ${ce.needed} responses, have ${ce.have}`}</div>
      </div>
      <div class="metric">
        <div class="label">Order similarity</div>
        <div class="value">${fmt(mv.sequence_similarity)}</div>
        <div class="against">${ceilingOk
          ? `people agree ${fmt(ce.sequence_similarity)}` : 'vs people: —'}</div>
      </div>
      <div class="metric">
        <div class="label">NSS</div>
        <div class="value">${fmt(mv.nss)}</div>
        <div class="against">0 = chance${bl.centre_bias.nss !== null
          ? ` · centre bias ${fmt(bl.centre_bias.nss)}` : ''}</div>
      </div>
      <div class="metric">
        <div class="label">Areas of interest</div>
        <div class="value">${a.aois.count}</div>
        <div class="against">from ${a.n_participants} people + ${a.n_model_samples} model runs</div>
      </div>
    </div>
    <div class="note">Areas of interest are clustered from the pooled human and
      model points, so neither side defines the yardstick it is measured
      against.${a.aois.unshared.total > 0 ? ` ${a.aois.unshared.model_only} area(s)
      only the model visited, ${a.aois.unshared.human_only} only people did —
      shared empties inflate the correlation, so read it with that in mind.` : ''}
      ${a.aois.bandwidth_widened ? ' Cluster width was widened to keep the count readable.' : ''}
    </div>`;
}

function renderLegend(layers, n, run) {
  const keys = [];
  if (layers.heatmap && n) keys.push(
    `<span class="key"><span class="swatch heat"></span>where people said they'd look — fewer &rarr; more</span>`);
  if (layers.paths && n) keys.push(
    `<span class="key"><span class="swatch path"></span>individual tap orders, first tap ringed pale</span>`);
  if (layers.gaze && n !== undefined) {
    keys.push(`<span class="key"><span class="swatch gazeheat"></span>where a
      different group actually looked &mdash; fewer &rarr; more</span>`);
  }
  if (layers.gaze_paths) {
    keys.push(`<span class="key"><span class="swatch gaze"></span>gaze traces,
      start ringed pale</span>`);
  }
  if (layers.model && run) {
    const extra = (run.samples_norm || []).length - 1;
    keys.push(`<span class="key"><span class="swatch model"></span>model prediction` +
      (extra > 0 ? `, numbered, with ${extra} more sampled observers` : ', numbered') +
      `</span>`);
  }
  $('legend').innerHTML = keys.join('');
}

function sizeCanvas() {
  const frame = $('frame');
  const c = $('heat');
  const r = frame.getBoundingClientRect();
  if (!r.width || !r.height) return false;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  const g = $('gaze');
  if (c.width !== w || c.height !== h) {
    c.width = w; c.height = h; g.width = w; g.height = h; return true;
  }
  return false;
}

async function tick() {
  let state, data, model, stats, gaze;
  try {
    [state, data, model, stats, gaze] = await Promise.all([
      fetch('/api/state').then((r) => r.json()),
      fetch('/api/markers').then((r) => r.json()),
      fetch('/api/model').then((r) => r.json()),
      fetch('/api/analysis').then((r) => r.json()),
      fetch('/api/gaze/aggregate').then((r) => r.json()),
    ]);
  } catch { return; }

  if (!state.image || !state.round_id) {
    setEmpty('The presenter has not chosen an image yet.');
    lastSignature = '';
    return;
  }

  // Rebuild only when something actually changed — a projector redrawing
  // every two seconds flickers and reads as broken.
  const signature = JSON.stringify([
    state.round_id, state.image.id, state.layers, data.count,
    data.paths.length && data.paths[data.paths.length - 1],
    model.run && [model.run.run_id, model.run.source, model.run.prompt_kind],
    gaze.contributors, state.capture_mode,
    state.layers.analysis && stats.ok && stats.model_vs_human,
    state.layers.prompt && model.config && model.config.prompt_text,
    state.layers.gaze && gaze.contributors,
    state.layers.gaze_paths && gaze.contributors,
    state.layers.charts && [data.count, gaze.contributors],
  ]);
  const changed = signature !== lastSignature;
  lastSignature = signature;

  if (state.round_id !== currentRoundId) {
    currentRoundId = state.round_id;
    if (!$('frame')) location.reload();
  }

  const frame = $('frame');
  if (frame.hidden) frame.hidden = false;
  // With both density layers on, the upper canvas painted over the lower one
  // and the tapped cloud simply vanished. Blended, the two show through each
  // other and their overlap reads as overlap.
  frame.classList.toggle('both-heat',
    !!(state.layers.heatmap && state.layers.gaze));
  if (imageAspect !== state.image.id) {
    imageAspect = state.image.id;
    frame.style.aspectRatio = `${state.image.width} / ${state.image.height}`;
    $('photo').src = '/img/' + encodeURIComponent(state.image.filename);
  }

  $('title').innerHTML = `${state.image.label}`;
  renderTallies(state, data, gaze);
  renderExplain(state, data, gaze, model.run);

  renderJson(state.layers.json);
  renderCharts(state.layers.charts);

  const resized = sizeCanvas();
  if ($('heat').width === 0) { lastSignature = ''; return; }  // retry next tick
  if (changed || resized) {
    drawHeatmap($('heat'), state.layers.heatmap ? data.points : [], 0.085, 'blue');
    renderGaze(gaze, state.layers.gaze);
    renderGazePaths(gaze, state.layers.gaze_paths);
    renderPaths(data.paths, state.layers.paths);
    renderModel(model.run, state.layers.model);
    renderSyntheticWarning(model.run, state.layers.model);
    renderExperimentalWarning(model.run, state.layers.model);
    renderPrompt(model.config, model.run, state.layers.prompt);
    renderAnalysis(stats, state.layers.analysis);
    renderLegend(state.layers, data.count, model.run);
  }
}

// Redraw on resize so the projector can be reconnected mid-session.
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { lastSignature = ''; tick(); }, 150);
});

$('photo').addEventListener('load', () => { lastSignature = ''; tick(); });

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
